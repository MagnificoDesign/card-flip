<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1016"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Card Flip">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>Card Flip</title>
<style>
:root{--bg:#0e1016;--card:#171a23;--line:#262b38;--tx:#e8ebf2;--mut:#8b93a7;--acc:#3b82f6;--up:#22c55e;--dn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,sans-serif;
padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 80px) calc(env(safe-area-inset-left) + 14px)}
h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:12px;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.k b{display:block;font-size:18px}.k span{color:var(--mut);font-size:12px}.big{grid-column:1/-1}.big b{font-size:28px}
.pos{color:var(--up)}.neg{color:var(--dn)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;background:#12151dee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;min-width:60px;background:none;border:0;color:var(--mut);font:600 12px system-ui;padding:8px 2px;border-radius:10px}nav button.on{color:var(--tx);background:var(--card)}
section{display:none;margin-top:16px}section.on{display:block}h2{font-size:16px;margin:0 0 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}.t{font-weight:600}.m{color:var(--mut);font-size:12px}
.flag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);text-transform:uppercase}
.flag.target_hit{background:#14532d;color:var(--up)}.flag.stop_hit{background:#450a0a;color:var(--bad)}.flag.window_expired{background:#451a03;color:var(--dn)}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px;margin:10px 0 4px}.fill{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:4px}
.tick{position:absolute;top:-3px;width:2px;height:14px;background:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 12px;font:600 12px system-ui}.chips button.on{color:var(--tx);border-color:var(--acc)}.nf{opacity:.6}.note{color:var(--mut);font-size:12px;margin-top:8px}
.ctl{display:flex;gap:6px;margin:6px 0}.ctl input,.ctl select{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid #333;background:#111;color:inherit;font:inherit}.more{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:inherit}.cnt{font-size:12px;margin:2px 0}</style></head><body>
<h1>Card Flip</h1><div class="sub" id="upd"></div>
<div class="grid" id="sum"></div>
<main id="main"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),usd=n=>(n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}),cls=n=>n<0?"neg":n>0?"pos":"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(render).catch(e=>{$("#upd").textContent="Could not load data: "+e});
function render(d){const s=d.summary;
$("#upd").textContent="Paper portfolio, updated "+new Date(d.generated_at).toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"})+" · hypothetical only";
const k=(l,v,c="",b="")=>`<div class="k ${b}"><span>${l}</span><b class="${c}">${v}</b></div>`;
$("#sum").innerHTML=k("Equity (net if sold)",usd(s.total_equity_net),"","big")+k("Cash",usd(s.cash))+k("Invested",usd(s.invested_cost))+k("Realized P&L",usd(s.realized_pnl),cls(s.realized_pnl))+k("Unrealized P&L",usd(s.unrealized_pnl_net),cls(s.unrealized_pnl_net))+k("Win rate",s.win_rate_pct==null?"—":s.win_rate_pct+"%")+k("Open",s.open_positions);
const eh=d.equity_history||[],base=s.starting_cash;let ch;
if(eh.length>=2){const W=340,H=150,P=28,vals=eh.map(e=>e.liquidation_equity).concat(base),mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1,x=i=>P+i*(W-P-8)/(eh.length-1),y=v=>8+(H-24)*(1-(v-mn)/r);
ch=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Equity history"><line x1="${P}" x2="${W-8}" y1="${y(base)}" y2="${y(base)}" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="${P}" y="${y(base)-4}" fill="var(--mut)" font-size="10">Start ${usd(base)}</text><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${eh.map((e,i)=>x(i)+","+y(e.liquidation_equity)).join(" ")}"/><text x="2" y="${H-4}" fill="var(--mut)" font-size="10">${eh[0].date}</text><text x="${W-70}" y="${H-4}" fill="var(--mut)" font-size="10">${eh.at(-1).date}</text></svg>`}
else ch=`<div class="note">Equity today (net if sold): <b>${usd(s.total_equity_net)}</b> vs ${usd(base)} start (${usd(s.total_equity_net-base)}). Chart appears after 2+ daily snapshots.</div>`;
$("#sum").insertAdjacentHTML("afterend",`<div class="item"><div class="t">Performance</div>${ch}</div>`);
const secs=[];
if(d.positions.length)secs.push(["Positions",d.positions.map(p=>{const sp=p.target_price-p.stop_price,pc=v=>Math.max(0,Math.min(100,(v-p.stop_price)/sp*100));
 return `<div class="item ${p.focus===false?"nf":""}"><div class="row"><span class="t">${esc(p.card)} · ${esc(p.grade)}</span><span class="flag ${p.sell_signal}">${p.sell_signal.replace("_"," ")}</span></div>
 <div class="m">${p.qty} × ${usd(p.unit_cost)} = ${usd(p.total_cost)} · now ${usd(p.current_price)} · <span class="${cls(p.unrealized_pnl)}">${usd(p.unrealized_pnl)} (${p.unrealized_pct}%)</span></div>
 <div class="bar"><div class="fill" style="width:${pc(p.current_price)}%"></div><div class="tick" style="left:${pc(p.unit_cost)}%"></div></div>
 <div class="row m"><span>Stop ${usd(p.stop_price)}</span><span>Cost ${usd(p.unit_cost)}</span><span>Target ${usd(p.target_price)}</span></div>
 <div class="m">${esc(p.sport||"")}${p.focus===false?" (non-focus)":""} · ${p.id} · exit by ${p.exit_by} · ${esc(p.source)}</div></div>`}).join("")+`<div class="note">Unrealized P&L assumes selling now: 13% fees + $5/unit shipping.</div>`]);
const chips=`<div class="chips">${["All","MLB","NBA","NFL"].map(x=>`<button data-sp="${x}" class="${x==="All"?"on":""}">${x}</button>`).join("")}</div>`;
const LS={};let lsN=0;
const card1=(x,c)=>`<div class="item"><div class="row"><span class="t">${esc(x.card)}</span><span class="${c}">${esc(x.change)}</span></div><div class="row m"><span>${esc(x.sport)} · <a style="color:var(--mut)" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.source.replace(/^https?:\/\//,"").split("/")[0])}</a></span><span>${x.price!=null?usd(x.price):""}</span></div></div>`;
const lst=(a,c)=>{const id="L"+(lsN++);LS[id]={a,c,sp:"All",q:"",sort:c==="pos"?"desc":"asc",n:25};return `<div class="lw" data-l="${id}">${chips}<div class="ctl"><input type="search" placeholder="Search cards…" data-q><select data-sort><option value="desc">% change: high → low</option><option value="asc">% change: low → high</option><option value="abs">Biggest move (abs)</option><option value="price">Price: high → low</option></select></div><div class="cnt m"></div><div class="li"></div><button class="more" data-more>Show more</button></div>`};
const rl=id=>{const st=LS[id],w=document.querySelector(`[data-l="${id}"]`);if(!w)return;const q=st.q.toLowerCase();let r=st.a.filter(x=>(st.sp==="All"||x.sport===st.sp)&&(!q||x.card.toLowerCase().includes(q)));const f={desc:(a,b)=>b.change_pct-a.change_pct,asc:(a,b)=>a.change_pct-b.change_pct,abs:(a,b)=>Math.abs(b.change_pct)-Math.abs(a.change_pct),price:(a,b)=>(b.price||0)-(a.price||0)}[st.sort];r=[...r].sort(f);w.querySelector(".li").innerHTML=r.slice(0,st.n).map(x=>card1(x,st.c)).join("")||'<div class="note">No matches.</div>';w.querySelector(".cnt").textContent=`Showing ${Math.min(st.n,r.length)} of ${r.length}`;const m=w.querySelector("[data-more]");m.style.display=r.length>st.n?"":"none";m.textContent=`Show more (${r.length-st.n} left)`;w.querySelector("[data-sort]").value=st.sort};
if(d.trending_up_view?.length)secs.push(["Up",lst(d.trending_up_view,"pos")]);
if(d.trending_down_view?.length)secs.push(["Down",lst(d.trending_down_view,"neg")]);
if(d.daily_movers?.length)secs.push(["Movers",`<table><tr><th>Card</th><th>1d</th></tr>${d.daily_movers.map(m=>`<tr><td>${esc(m.card)}</td><td class="${cls(m.change_1d_pct)}">${m.change_1d_pct}%</td></tr>`).join("")}</table>`]);
const pc2=v=>v==null?"—":(v>0?"+":"")+v+"%";
if(d.report_card?.length)secs.push(["Report",`<table><tr><th>#</th><th>Source</th><th>Buys</th><th>W-L</th><th>Win</th><th>Avg closed</th><th>Avg open</th></tr>${d.report_card.map(c=>`<tr><td>${c.rank}</td><td>${esc(c.source)}<div class="m">${c.positions.join(", ")||"—"}</div></td><td>${c.buys}</td><td>${c.wins}-${c.losses}</td><td>${c.win_rate_pct==null?"—":c.win_rate_pct+"%"}</td><td>${pc2(c.avg_closed_return_pct)}</td><td class="${cls(c.avg_open_gross_pct)}">${pc2(c.avg_open_gross_pct)}</td></tr>`).join("")}</table><div class="note">Positions backed by several sources count for each. Avg open = gross price change vs cost, before fees. Ranked by win rate, then avg closed return, then avg open %.</div>`]);
if(d.signal_sources?.length)secs.push(["Signals",`<table><tr><th>Source</th><th>Logged</th><th>Bought</th><th>W</th><th>L</th><th>Acc</th></tr>${d.signal_sources.map(x=>`<tr><td>${esc(x.source)}</td><td>${x.logged}</td><td>${x.bought}</td><td>${x.wins}</td><td>${x.losses}</td><td>${x.wins+x.losses?Math.round(x.wins/(x.wins+x.losses)*100)+"%":"—"}</td></tr>`).join("")}</table><div class="note">Accuracy fills in as positions close.</div>`]);
if(d.closed_trades?.length)secs.push(["Closed",`<table><tr><th>Card</th><th>Qty</th><th>Exit</th><th>P&L</th></tr>${d.closed_trades.map(c=>`<tr><td>${esc(c.card)}</td><td>${c.qty}</td><td>${usd(c.exit)}</td><td class="${cls(c.pnl)}">${usd(c.pnl)}</td></tr>`).join("")}</table>`]);
$("#main").innerHTML=secs.map(([n,h],i)=>`<section id="s${i}" class="${i?"":"on"}"><h2>${n==="Up"?"Trending up":n==="Down"?"Trending down":n==="Movers"?"Daily movers":n==="Signals"?"Signals by source":n==="Report"?"Signal report card":n==="Closed"?"Closed trades":n}</h2>${h}</section>`).join("");
$("#nav").innerHTML=secs.map(([n],i)=>`<button class="${i?"":"on"}" data-i="${i}">${n}</button>`).join("");
$("#main").addEventListener("click",e=>{const w=e.target.closest(".lw");if(!w)return;const id=w.dataset.l,st=LS[id];const b=e.target.closest(".chips button");if(b){w.querySelectorAll(".chips button").forEach(x=>x.classList.toggle("on",x===b));st.sp=b.dataset.sp;st.n=25;rl(id)}if(e.target.closest("[data-more]")){st.n+=25;rl(id)}});
$("#main").addEventListener("input",e=>{const w=e.target.closest(".lw");if(!w)return;const st=LS[w.dataset.l];if(e.target.matches("[data-q]")){st.q=e.target.value;st.n=25}if(e.target.matches("[data-sort]"))st.sort=e.target.value;rl(w.dataset.l)});
$("#main").addEventListener("change",e=>{const w=e.target.closest(".lw");if(w&&e.target.matches("[data-sort]")){LS[w.dataset.l].sort=e.target.value;rl(w.dataset.l)}});
Object.keys(LS).forEach(rl);
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button,section").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("#s"+b.dataset.i).classList.add("on");scrollTo(0,0)};}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
